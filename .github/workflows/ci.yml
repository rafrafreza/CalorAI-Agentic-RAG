name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, tests, retrieval eval
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            backend/requirements.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint & format
        run: |
          ruff check .
          ruff format --check backend evals tests
      - name: Tests (offline; scripted LLM drives the real LangGraph agent)
        run: pytest --cov=backend --cov-report=term-missing:skip-covered
      - name: Retrieval eval on the held-out split (quality gate)
        run: |
          python -m evals.retrieval_eval --split test --gate | tee eval.md
          cat eval.md >> "$GITHUB_STEP_SUMMARY"

  frontend:
    name: Frontend · typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    name: Docker · build & boot
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t calorai:ci .
      - name: Boot and probe
        run: |
          docker run -d --name calorai -p 8000:8000 calorai:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo
              curl -fsS -o /dev/null http://localhost:8000/ && echo "web app served"
              curl -fsS -X POST -F "message=had 2 parathas and chai" http://localhost:8000/api/chat | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['meals_changed'], r; print(r['response'])"
              exit 0
            fi
            sleep 1
          done
          docker logs calorai
          exit 1
