[project]
name = "calorai"
version = "2.0.0"
description = "Agentic RAG nutrition copilot: LangGraph agent + hybrid retrieval over a nutrition knowledge base"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["frontend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "B008",    # FastAPI's Form()/File() defaults are the documented pattern
  "RUF001",  # intentional typographic characters (× · —) in user-facing strings
  "RUF002",
  "RUF003",
  "SIM108",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"backend/agent/prompts.py" = ["E501"]  # prompt prose
